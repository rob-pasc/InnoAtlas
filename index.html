<!doctype html>
<!-- German is the default UI language; LanguageProvider rewrites this attribute
     on every language switch (see src/i18n/LanguageContext.tsx). -->
<html lang="de" class="overflow-x-clip">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Innovationslandkarte der Labore des Wissenschaftsverbundes Vierländerregion Bodensee" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Innovationslandkarte Bodenseeregion</title>

    <!-- Link previews (Teams, Slack, LinkedIn, WhatsApp …). Most scrapers
         ignore a relative og:image, so set the VITE_SITE_URL environment
         variable to the deployed origin at build time (see README). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Innovationslandkarte Bodenseeregion" />
    <meta property="og:title" content="Innovationslandkarte Bodenseeregion" />
    <meta property="og:description" content="Innovationsprojekte aus Deutschland, Österreich, der Schweiz und Liechtenstein entdecken und vernetzen." />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bodensee bei Lindau mit Alpenpanorama und dem Schriftzug Innovationslandkarte Bodenseeregion" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
